name: Publish security reports

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Validate static transparency reports
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Validate public reports
        shell: pwsh
        run: ./scripts/Test-PublicReport.ps1 -SiteRoot . -RequireMainReport

      - name: Prepare static Pages artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path site -Force | Out-Null
          Copy-Item -LiteralPath index.html -Destination site/index.html
          Copy-Item -LiteralPath reports -Destination site/reports -Recurse
          Copy-Item -LiteralPath trend -Destination site/trend -Recurse

      - name: Validate static Pages artifact
        shell: pwsh
        run: ./scripts/Test-PublicReport.ps1 -SiteRoot site -RequireMainReport

      - name: Upload static report site
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-report-site
          path: site
          if-no-files-found: error
          retention-days: 30

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download static report site
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: public-report-site
          path: site

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
